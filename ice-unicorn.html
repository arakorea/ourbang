<script id="ourbang-clean-url">
(() => {
  'use strict';

  const currentPath = window.location.pathname;
  let cleanPath = currentPath;

  if (/\/index\.html$/i.test(currentPath)) {
    cleanPath = currentPath.replace(/index\.html$/i, '');
  } else if (/\.html$/i.test(currentPath)) {
    cleanPath = currentPath.replace(/\.html$/i, '');
  }

  if (cleanPath !== currentPath && window.history?.replaceState) {
    window.history.replaceState(
      window.history.state,
      '',
      `${cleanPath || '/'}${window.location.search}${window.location.hash}`
    );
  }
})();
</script>

  function normalize(lang) {
    return supported.includes(lang) ? lang : 'ko';
  }

  function translate(source, lang) {
    const safe = normalize(lang);
    if (safe === 'en') return source;
    if (safe === 'ko') return source;
    return text[safe]?.[source] ?? source;
  }

  function choose(english, korean, lang) {
    const safe = normalize(lang);
    if (safe === 'ko') return korean;
    if (safe === 'en') return english;
    return text[safe]?.[english] ?? english;
  }

  function translateRich(source, lang) {
    const safe = normalize(lang);
    if (safe === 'en') return source;
    if (safe === 'ko') return source;
    return richText[safe]?.[source] ?? source;
  }

  function customHtml(page, key, lang) {
    const safe = normalize(lang);
    return custom[page]?.[key]?.[safe] ?? custom[page]?.[key]?.en ?? '';
  }

  function installAttributes() {
    document.querySelectorAll('[data-en][data-ko]').forEach((el) => {
      const source = el.getAttribute('data-en');
      el.setAttribute('data-ja', text.ja[source] ?? source);
      el.setAttribute('data-zh', text.zh[source] ?? source);
    });

    document.querySelectorAll('[data-en-html][data-ko-html]').forEach((el) => {
      const source = el.getAttribute('data-en-html');
      el.setAttribute('data-ja-html', richText.ja[source] ?? source);
      el.setAttribute('data-zh-html', richText.zh[source] ?? source);
    });

    const style = document.createElement('style');
    style.id = 'ourbang-four-language-fit';
    style.textContent = '@media(max-width:640px){.nav,.ourNav{gap:8px!important}.langs,.ourLangs{gap:2px!important}.langBtn,.ourLangBtn{width:28px!important;height:30px!important;border-radius:10px!important;font-size:9px!important}.langBtn[data-lang="zh"],.ourLangBtn[data-lang="zh"]{width:34px!important}.menuBtn,.ourMenuBtn{width:38px!important}}';
    document.head.appendChild(style);
  }

  function applyDocumentLanguage(lang) {
    const safe = normalize(lang);
    document.documentElement.lang = htmlLang[safe];
    document.querySelectorAll('.langBtn, .ourLangBtn').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.lang === safe));
    });
    document.querySelectorAll('.menuBtn, .ourMenuBtn').forEach((button) => {
      button.setAttribute('aria-label', menuLabel[safe]);
    });
    return safe;
  }

  window.OURBANG_I18N = {
    supported,
    normalize,
    translate,
    choose,
    translateRich,
    customHtml,
    applyDocumentLanguage
  };

  installAttributes();

<script>const langButtons=[...document.querySelectorAll('.langBtn')],translatables=[...document.querySelectorAll('[data-en][data-ko]')];function setLanguage(lang){const safe=window.OURBANG_I18N.applyDocumentLanguage(lang);translatables.forEach(el=>el.textContent=el.dataset[safe]);langButtons.forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===safe));localStorage.setItem('ourbang-language',safe)}langButtons.forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));setLanguage(localStorage.getItem('ourbang-language')||'ko');const menuBtn=document.querySelector('.menuBtn'),mobilePanel=document.getElementById('mobilePanel');menuBtn.addEventListener('click',()=>{const open=!mobilePanel.classList.contains('open');mobilePanel.classList.toggle('open',open);document.body.classList.toggle('menuOpen',open);menuBtn.setAttribute('aria-expanded',String(open))});mobilePanel.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobilePanel.classList.remove('open');document.body.classList.remove('menuOpen');menuBtn.setAttribute('aria-expanded','false')}));const finePointer=window.matchMedia('(pointer:fine)').matches;
const hero=document.querySelector('.hero'),iceSculpture=document.querySelector('.iceSculpture');
if(finePointer&&hero&&iceSculpture){
  hero.addEventListener('pointermove',e=>{
    const r=hero.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    iceSculpture.style.setProperty('--ix',`${(x*11).toFixed(1)}px`);
    iceSculpture.style.setProperty('--iy',`${(y*11).toFixed(1)}px`);
  });
  hero.addEventListener('pointerleave',()=>{
    iceSculpture.style.setProperty('--ix','0px');
    iceSculpture.style.setProperty('--iy','0px');
  });
}
const revealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');revealObserver.unobserve(entry.target)}})},{threshold:.12,rootMargin:'0px 0px -8%'});document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));document.getElementById('year').textContent=new Date().getFullYear();</script>
