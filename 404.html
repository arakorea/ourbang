<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OURBANG</title>
  <meta name="robots" content="noindex">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#07090f;color:#f7f8fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    main{text-align:center;padding:32px}
    a{color:inherit;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:13px 18px;display:inline-block;margin-top:20px;touch-action:manipulation}
  </style>
  <script>
    (() => {
      'use strict';
      const routes = new Set([
        'index', 'explore', 'create', 'live', 'vision', 'contact',
        'tikoonz', 'ice-unicorn', 'boomboomboom', 'boomboomboom-experience',
        'ak-enm', 'ara-korea', 'music', 'visual', 'space'
      ]);
      const trimmed = window.location.pathname.replace(/\/+$/, '');
      const slash = trimmed.lastIndexOf('/');
      const base = trimmed.slice(0, slash + 1) || '/';
      const route = decodeURIComponent(trimmed.slice(slash + 1));

      if (routes.has(route)) {
        window.location.replace(`${base}${route}.html${window.location.search}${window.location.hash}`);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>OURBANG</h1>
    <p>요청하신 페이지를 찾을 수 없습니다.</p>
    <a href="index.html">HOME</a>
  </main>
</body>
</html>
