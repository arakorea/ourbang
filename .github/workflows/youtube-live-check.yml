name: OURBANG YouTube Live Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: ourbang-youtube-live-check
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube live channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ.get("YOUTUBE_API_KEY")

          if not API_KEY:
              raise RuntimeError("YOUTUBE_API_KEY secret is missing.")

          # OURBANG에서 확인할 YouTube 채널
          CHANNELS = [
              {
                  "key": "akenm",
                  "name": "AK ENM",
                  "handle": "@akenm79",
                  "url": "https://www.youtube.com/@akenm79"
              },
              {
                  "key": "tikoonz",
                  "name": "TIKOONZ",
                  "handle": "@tikoonz",
                  "url": "https://www.youtube.com/@tikoonz"
              },
              {
                  "key": "arakorea",
                  "name": "ARA KOREA",
                  "handle": "@ampkind",
                  "url": "https://www.youtube.com/@ampkind"
              }
          ]

          def youtube_api(resource, params):
              params = dict(params)
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + resource
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "OURBANG-Live-Checker/1.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          live_channels = []

          for channel in CHANNELS:

              print("Checking:", channel["name"])

              channel_data = youtube_api(
                  "channels",
                  {
                      "part": "id",
                      "forHandle": channel["handle"]
                  }
              )

              items = channel_data.get("items", [])

              if not items:
                  print(
                      "Channel not found:",
                      channel["handle"]
                  )
                  continue

              channel_id = items[0]["id"]

              search_data = youtube_api(
                  "search",
                  {
                      "part": "snippet",
                      "channelId": channel_id,
                      "eventType": "live",
                      "type": "video",
                      "maxResults": 5
                  }
              )

              for item in search_data.get("items", []):

                  video_id = (
                      item.get("id", {})
                      .get("videoId")
                  )

                  if not video_id:
                      continue

                  snippet = item.get("snippet", {})

                  live_channels.append(
                      {
                          "channelKey": channel["key"],
                          "channelName": channel["name"],
                          "channelUrl": channel["url"],
                          "videoId": video_id,
                          "videoUrl":
                              "https://www.youtube.com/watch?v="
                              + video_id,
                          "embedUrl":
                              "https://www.youtube.com/embed/"
                              + video_id,
                          "title":
                              snippet.get("title")
                              or channel["name"] + " LIVE"
                      }
                  )

          result = {
              "isLive": len(live_channels) > 0,
              "liveCount": len(live_channels),
              "streams": live_channels,
              "checkedAt":
                  datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
          }

          # 첫 번째 LIVE를 대표 방송으로 지정
          if live_channels:
              first = live_channels[0]

              result["videoId"] = first["videoId"]
              result["title"] = first["title"]
              result["channelKey"] = first["channelKey"]
              result["channelName"] = first["channelName"]
              result["channelUrl"] = first["channelUrl"]
              result["videoUrl"] = first["videoUrl"]
              result["embedUrl"] = first["embedUrl"]

          else:
              result["videoId"] = ""
              result["title"] = ""
              result["channelKey"] = ""
              result["channelName"] = ""
              result["channelUrl"] = ""
              result["videoUrl"] = ""
              result["embedUrl"] = ""

          with open(
              "live-status.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

              file.write("\n")

          print("")
          print("===== OURBANG LIVE STATUS =====")
          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Commit live status
        run: |
          if git diff --quiet -- live-status.json; then
            echo "No changes in live-status.json"
            exit 0
          fi

          git config user.name "ourbang-live-bot"
          git config user.email "actions@users.noreply.github.com"

          git add live-status.json
          git commit -m "Update YouTube live status"
          git push
